name: Atualizar dados e publicar

on:
  schedule:
    - cron: '23 8 * * *'       # todos os dias às 08:23 (UTC): Sorare + odds
    - cron: '23 14,20 * * *'   # 14:23 e 20:23 (UTC): só Sorare (poupa créditos das odds)
  workflow_dispatch:
    inputs:
      odds:
        description: 'Atualizar também as odds (gasta ~8 créditos da The Odds API)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ir buscar dados ao Sorare e às odds
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WITH_ODDS: ${{ (github.event_name == 'workflow_dispatch' && inputs.odds) || github.event.schedule == '23 8 * * *' }}
        run: |
          if [ "$WITH_ODDS" = "true" ]; then python scripts/fetch_data.py --odds; else python scripts/fetch_data.py; fi

      - name: Guardar os dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || (git commit -m "Atualizar dados" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v4
